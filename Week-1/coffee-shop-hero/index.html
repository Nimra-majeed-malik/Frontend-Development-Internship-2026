<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brew & Co. Coffee Shop</title>
  </head>
  <body class="bg-white overflow-x-hidden">
    <!-- Navigation -->
    <nav class="flex justify-between items-center px-6 py-5 md:px-12">
      <span class="text-2xl font-bold text-amber-800 tracking-tight">Brew & Co.</span>

      <ul class="hidden md:flex gap-10 text-gray-700 font-medium">
        <li><a href="#" class="relative hover:text-amber-800 transition-colors duration-300 after:content-[''] after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-[2px] after:bg-amber-800 after:transition-all after:duration-300 hover:after:w-full">Menu</a></li>
        <li><a href="#" class="relative hover:text-amber-800 transition-colors duration-300 after:content-[''] after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-[2px] after:bg-amber-800 after:transition-all after:duration-300 hover:after:w-full">About</a></li>
        <li><a href="#" class="relative hover:text-amber-800 transition-colors duration-300 after:content-[''] after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-[2px] after:bg-amber-800 after:transition-all after:duration-300 hover:after:w-full">Contact</a></li>
      </ul>

      <button id="menu-btn" class="md:hidden text-gray-700 text-2xl hover:text-amber-800 transition-colors duration-300">☰</button>
    </nav>

    <!-- Mobile menu -->
    <ul id="mobile-menu" class="hidden flex-col gap-4 px-6 pb-4 text-gray-700 md:hidden">
      <li><a href="#" class="hover:text-amber-800 transition-colors duration-300">Menu</a></li>
      <li><a href="#" class="hover:text-amber-800 transition-colors duration-300">About</a></li>
      <li><a href="#" class="hover:text-amber-800 transition-colors duration-300">Contact</a></li>
    </ul>

    <!-- Hero section -->
    <section class="flex flex-col md:flex-row items-center justify-between px-6 md:px-12 py-10 md:py-16 gap-10 max-w-7xl mx-auto">
      <div class="max-w-lg text-center md:text-left">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4 leading-tight">
          Your Perfect Cup, Every Morning
        </h1>
        <p class="text-gray-600 mb-8 text-lg">
          Freshly roasted beans, brewed with love — visit us or order online.
        </p>
        <button class="bg-amber-800 text-white px-8 py-3 rounded-lg font-medium hover:bg-amber-900 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300">
          Order Now
        </button>
      </div>

      <div class="w-full md:w-2/5 max-w-md">
        <img
          src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600"
          alt="Coffee cup"
          class="rounded-2xl w-full h-80 md:h-96 object-cover shadow-xl hover:shadow-2xl hover:scale-[1.02] transition-all duration-300"
        />
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
